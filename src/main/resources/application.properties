# ===================================================================
# FREEALLA - Smart Bus Reservation System Configuration
# ===================================================================
server.port=${PORT:8080}
server.servlet.context-path=/

# App Info
spring.application.name=busora

# -------------------------------------------------------------------
# Database Configuration
# Default: H2 Database in MySQL mode (Works out-of-the-box without MySQL setup)
# To switch to MySQL Server: change profile to 'mysql' or update properties below
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:busora_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JSON settings
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

